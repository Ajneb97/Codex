# Enables or disables the plugin update message when joining the server.
update_notify: true

# This option defines the time (in seconds) to automatically save
# player data.
player_data_save: 300

# Format to display dates when a discovery was found.
discoveries_date_format: "dd/MM/yyyy"

# Format of the %progress_bar% variable on the lore of category items.
progress_bar_placeholder:
  filled_symbol: "&a|"
  empty_symbol: "&c|"
  amount: 20

# Defines if every message/text in the plugin should use the MiniMessage format.
# Only works on Paper 1.19.4+.
use_minimessage: false

# MySQL support credentials.
mysql_database:
  enabled: false
  host: localhost
  port: 3306
  username: root
  password: root
  database: database

  # Pool properties:
  # https://github.com/brettwooldridge/HikariCP#configuration-knobs-baby
  pool:
    connectionTimeout: 5000

  # Advanced properties:
  # https://dev.mysql.com/doc/connector-j/en/connector-j-reference-configuration-properties.html
  advanced:
    verifyServerCertificate: false
    useSSL: true
    allowPublicKeyRetrieval: true

# Don't modify.
config_version: 2


